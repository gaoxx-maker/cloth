services:
  - type: web
    name: fashion-explorer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python ../scripts/generate_products.py && python ../scripts/seed_database.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fashion-explorer-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: fashion-explorer-db
    databaseName: fashion_explorer
    user: fashion_explorer
    plan: free
    postgresMajorVersion: "17"
