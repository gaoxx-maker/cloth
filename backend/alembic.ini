[alembic]
script_location = alembic
prepend_sys_path = .
# The real connection URL is read from .env / DATABASE_URL in alembic/env.py.
# This value is only a fallback for offline mode.
sqlalchemy.url = postgresql+psycopg://fashion_explorer:fashion_explorer@localhost:5432/fashion_explorer

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
