services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fashion_explorer
      POSTGRES_USER: fashion_explorer
      POSTGRES_PASSWORD: fashion_explorer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_explorer -d fashion_explorer"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
